  <style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; }
    /* Smooth boot fade-in: start invisible (Electron window bg shows through —
       set to #1a1410 in main.js, matching night theme), fade in only after
       React has painted the first child of #root. Eliminates the "flash of
       bare bg before content" on refresh per user 2026-04-29 反馈. */
    body {
      background: var(--bg-page); background-color: var(--bg-base);
      opacity: 0;
      transition: opacity 280ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    body.app-ready { opacity: 1; }
    #root { width: 100%; height: 100%; display: flex; }

    /* Auto-hiding scrollbars — alpha is driven from JS (rAF tween) via the
       inline custom property --scrollbar-alpha on the scrolled element.
       Chromium does NOT honor `transition` on ::-webkit-scrollbar-thumb
       (steps discretely instead of interpolating), so we paint each frame
       manually. Default alpha = 0 (invisible at rest). */
    *::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-corner { background: transparent; }
    *::-webkit-scrollbar-thumb {
      background-color: rgba(var(--scroll-rgb), var(--scrollbar-alpha, 0));
      border-radius: 5px;
      border: 3px solid transparent;
      background-clip: padding-box;
    }
    /* Firefox — same custom-property mechanism */
    * { scrollbar-width: thin; scrollbar-color: rgba(var(--scroll-rgb), var(--scrollbar-alpha, 0)) transparent; }
  </style>
  <script>
    /* Smooth scrollbar fade — JS rAF tween of --scrollbar-alpha on the
       scrolled element. Curve B per spec: stop → 50ms debounce → 3000ms
       cubic ease-out fade to 0. Chromium repaints scrollbar pseudo on
       every custom-property update, so we get a real per-frame
       interpolation that the native transition path refuses to do. */
    (() => {
      const FADE_MS = 3000;
      const PEAK_ALPHA = 0.32;
      const HOLD_AFTER_SCROLL = 50;
      const tracked = new WeakMap();
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      function ensure(el) {
        let s = tracked.get(el);
        if (!s) { s = { alpha: 0, raf: 0, fadeTimer: 0 }; tracked.set(el, s); }
        return s;
      }
      function setAlpha(el, a) {
        el.style.setProperty('--scrollbar-alpha', a);
        ensure(el).alpha = a;
      }
      function startFade(el) {
        const s = ensure(el);
        cancelAnimationFrame(s.raf);
        const startAlpha = s.alpha;
        if (startAlpha <= 0) return;
        const startT = performance.now();
        const tick = (now) => {
          const p = Math.min(1, (now - startT) / FADE_MS);
          const a = startAlpha * (1 - easeOutCubic(p));
          setAlpha(el, a);
          if (p < 1) s.raf = requestAnimationFrame(tick);
          else setAlpha(el, 0);
        };
        s.raf = requestAnimationFrame(tick);
      }

      document.addEventListener('scroll', (e) => {
        const el = e.target instanceof Element
          ? e.target
          : (document.scrollingElement || document.documentElement);
        if (!el) return;
        const s = ensure(el);
        cancelAnimationFrame(s.raf);
        clearTimeout(s.fadeTimer);
        setAlpha(el, PEAK_ALPHA);
        s.fadeTimer = setTimeout(() => startFade(el), HOLD_AFTER_SCROLL);
      }, true);
    })();
  </script>

  <script>
    /* Watch for React's first paint into #root, then add app-ready class
       to trigger body fade-in. 1500ms failsafe: even if React fails to
       mount, body becomes visible (don't trap user in black screen). */
    (() => {
      const failsafe = setTimeout(() => document.body.classList.add('app-ready'), 1500);
      const reveal = () => {
        clearTimeout(failsafe);
        requestAnimationFrame(() => document.body.classList.add('app-ready'));
      };
      const startObserve = () => {
        const root = document.getElementById('root');
        if (!root) return;
        if (root.firstElementChild) { reveal(); return; }
        const obs = new MutationObserver(() => {
          if (root.firstElementChild) { obs.disconnect(); reveal(); }
        });
        obs.observe(root, { childList: true });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startObserve);
      } else {
        startObserve();
      }
    })();
  </script>
