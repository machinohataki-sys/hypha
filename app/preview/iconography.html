<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .item { display: inline-flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 12px 16px; border-radius: 14px; min-width: 96px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .glyph { font-family: var(--font-mono); font-size: 22px; color: var(--brass-bright); }
  .lbl   { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="item"><div class="glyph">›</div><div class="lbl">prompt</div></div>
    <div class="item"><div class="glyph">⤷</div><div class="lbl">trace</div></div>
    <div class="item"><div class="glyph">▸</div><div class="lbl">collapsed</div></div>
    <div class="item"><div class="glyph">▾</div><div class="lbl">expanded</div></div>
    <div class="item"><div class="glyph">¶</div><div class="lbl">paragraph</div></div>
    <div class="item"><div class="glyph">§</div><div class="lbl">section</div></div>
    <div class="item"><div class="glyph">✓</div><div class="lbl">held</div></div>
    <div class="item"><div class="glyph">⨯</div><div class="lbl">flag</div></div>
  </div>
</div></body></html>
