<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .term { padding: 18px 22px;
    background: #1a1410;
    border-radius: 18px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(168,133,109,0.10);
    font-family: var(--font-mono); font-size: 14px; line-height: 1.62; color: var(--fg-1);
  }
  .prompt { color: var(--brass-bright); }
  .dim { color: var(--fg-3); }
  .clean { color: var(--verdict-clean); }
  em { color: var(--hush); font-style: italic; }
</style></head>
<body><div class="card">
  <div class="term">
    <div><span class="prompt">›</span> verify "the categorical imperative is consequentialist"</div>
    <div class="dim">  ⤷ checking against vault…</div>
    <div>  ⤷ <em>kant.md</em> ¶12 contradicts.</div>
    <div class="clean">  ⤷ verdict · held</div>
  </div>
</div></body></html>
