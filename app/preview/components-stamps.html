<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .stamp { display: inline-flex; align-items: center; padding: 5px 16px; border-radius: 999px;
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
  }
  .clean   { color: var(--verdict-clean); box-shadow: inset 0 0 0 1px rgba(95,166,122,0.55); background: rgba(95,166,122,0.12); }
  .held    { color: var(--brass-bright);  box-shadow: inset 0 0 0 1px rgba(213,178,138,0.55); background: rgba(213,178,138,0.10); }
  .open    { color: var(--hush);          box-shadow: inset 0 0 0 1px rgba(180,139,154,0.55); background: rgba(180,139,154,0.10); }
  .flag    { color: var(--verdict-flag);  box-shadow: inset 0 0 0 1px rgba(196,106,93,0.55); background: rgba(196,106,93,0.12); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.10em; text-transform: uppercase; margin-top: 12px; }
</style></head>
<body><div class="card">
  <div class="row">
    <span class="stamp clean">clean</span>
    <span class="stamp held">held</span>
    <span class="stamp open">open</span>
    <span class="stamp flag">contradicts</span>
  </div>
  <div class="lbl">verdict stamps · mono · tracked +0.22em · pill</div>
</div></body></html>
