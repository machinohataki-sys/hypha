<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; align-items: flex-end; gap: 14px; padding: 8px 4px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: linear-gradient(180deg, #d5b28a, #a8856d); border-radius: 4px; width: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.06em; }
  .num { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
</style></head>
<body><div class="card">
  <div class="row">
    <div class="step"><div class="bar" style="height:4px"></div><div class="num">4</div><div class="lbl">s-1</div></div>
    <div class="step"><div class="bar" style="height:8px"></div><div class="num">8</div><div class="lbl">s-2</div></div>
    <div class="step"><div class="bar" style="height:12px"></div><div class="num">12</div><div class="lbl">s-3</div></div>
    <div class="step"><div class="bar" style="height:16px"></div><div class="num">16</div><div class="lbl">s-4</div></div>
    <div class="step"><div class="bar" style="height:24px"></div><div class="num">24</div><div class="lbl">s-5</div></div>
    <div class="step"><div class="bar" style="height:32px"></div><div class="num">32</div><div class="lbl">s-6</div></div>
    <div class="step"><div class="bar" style="height:48px"></div><div class="num">48</div><div class="lbl">s-7</div></div>
    <div class="step"><div class="bar" style="height:64px"></div><div class="num">64</div><div class="lbl">s-8</div></div>
    <div class="step"><div class="bar" style="height:96px"></div><div class="num">96</div><div class="lbl">s-9</div></div>
  </div>
</div></body></html>
