<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .item { display: flex; align-items: center; gap: 14px; padding: 10px 14px;
    border-radius: 14px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .chip { width: 18px; height: 18px; border-radius: 9px;
    box-shadow: inset 0 0 0 1px rgba(168,133,109,0.30);
  }
  .key { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); flex: 1; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="row2">
    <div class="item"><div class="chip" style="background:#f2e6da"></div><div class="key">--fg-1</div><div class="hex">#f2e6da</div></div>
    <div class="item"><div class="chip" style="background:#d8c4b1"></div><div class="key">--fg-2</div><div class="hex">#d8c4b1</div></div>
    <div class="item"><div class="chip" style="background:#a89886"></div><div class="key">--fg-3</div><div class="hex">#a89886</div></div>
    <div class="item"><div class="chip" style="background:#7a6c5d"></div><div class="key">--fg-4</div><div class="hex">#7a6c5d</div></div>
  </div>
</div></body></html>
