<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .stack { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .glass1, .glass2, .glass3 {
    border-radius: 18px; padding: 14px 18px;
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18), 0 18px 48px -22px rgba(0,0,0,0.7);
  }
  .glass1 { background: rgba(58,46,38,0.42); }
  .glass2 { background: rgba(44,36,31,0.58); }
  .glass3 { background: rgba(26,20,16,0.72); }
  .name { font-family: var(--font-serif); font-style: italic; font-size: 17px; color: var(--fg-1); }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 2px; letter-spacing: 0.06em; }
  .card { background: var(--espresso-2); }
</style></head>
<body><div class="card">
  <div class="stack">
    <div class="glass1"><div class="name">glass · light</div><div class="v">rgba(58,46,38,0.42) · floating chips</div></div>
    <div class="glass2"><div class="name">glass · standard</div><div class="v">rgba(44,36,31,0.58) · panels</div></div>
    <div class="glass3"><div class="name">glass · strong</div><div class="v">rgba(26,20,16,0.72) · dialogs · terminal</div></div>
  </div>
</div></body></html>
