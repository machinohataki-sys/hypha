<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .panel {
    border-radius: 14px; height: 110px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    padding: 12px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .l1 { box-shadow: inset 0 1px 0 rgba(232,196,176,0.06), 0 8px 24px -10px rgba(0,0,0,0.55); }
  .l2 { box-shadow: inset 0 1px 0 rgba(232,196,176,0.12), 0 18px 48px -22px rgba(0,0,0,0.7), 0 4px 14px -8px rgba(26,20,16,0.6); }
  .l3 { box-shadow: inset 0 1px 0 rgba(232,196,176,0.14), 0 40px 90px -30px rgba(0,0,0,0.85), 0 12px 32px -16px rgba(26,20,16,0.7); }
  .name { font-family: var(--font-serif); font-style: italic; font-size: 16px; color: var(--fg-1); }
  .v    { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-top: 4px; letter-spacing: 0.05em; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="panel l1"><div class="name">lift 1</div><div class="v">chips · inline cards</div></div>
    <div class="panel l2"><div class="name">lift 2</div><div class="v">standard panel</div></div>
    <div class="panel l3"><div class="name">modal</div><div class="v">dialog over scrim</div></div>
  </div>
</div></body></html>
