<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .card { padding: 28px 24px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; cursor: pointer; position: relative; }

  /* ─── Primary — engraved brass rule on espresso ───
     The luxury cue is restraint: a single hairline, mono small-caps,
     and an amber dot. No fills, no bevels. */
  .btn-primary {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #f2e6da;
    padding: 11px 20px 11px 18px;
    border: 0; border-radius: 14px;
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(213,178,138,0.65);
    display: inline-flex; align-items: center; gap: 12px;
    transition: color 220ms cubic-bezier(0.4,0,0.2,1),
                box-shadow 220ms cubic-bezier(0.4,0,0.2,1);
  }
  .btn-primary::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8a13c, #a8856d);
    box-shadow: 0 0 10px -1px rgba(232,161,60,0.6);
  }
  .btn-primary:hover {
    color: #ffffff;
    box-shadow: inset 0 0 0 1px rgba(232,161,60,0.85);
  }
  .btn-primary:active { color: #d5b28a; }

  /* ─── Secondary — text + underline rule, no container ─── */
  .btn-secondary {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #d8c4b1;
    padding: 11px 4px;
    border: 0; background: transparent;
    border-bottom: 1px solid rgba(168,133,109,0.50);
    border-radius: 0;
    transition: color 220ms cubic-bezier(0.4,0,0.2,1),
                border-color 220ms cubic-bezier(0.4,0,0.2,1);
  }
  .btn-secondary:hover { color: #f2e6da; border-color: rgba(213,178,138,0.85); }

  /* ─── Tertiary — bare mono caps, the soft dismissal ─── */
  .btn-tertiary {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--fg-3);
    padding: 11px 8px; border: 0; background: transparent;
    border-radius: 14px;
    transition: color 160ms cubic-bezier(0.4,0,0.2,1);
  }
  .btn-tertiary:hover { color: var(--fg-1); }

  /* ─── Disabled — quieter, not greyer ─── */
  .btn-disabled {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(168, 152, 134, 0.32);
    padding: 11px 20px;
    border: 0; border-radius: 14px;
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(168,133,109,0.12);
    cursor: not-allowed;
  }

  .lbl { font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-4); letter-spacing: 0.14em; text-transform: uppercase; }
  .labels { display: grid; grid-template-columns: repeat(4, auto); gap: 22px; margin-top: 18px; justify-content: start; }
</style></head>
<body><div class="card">
  <div class="row">
    <button class="btn-primary">verify</button>
    <button class="btn-secondary">open both</button>
    <button class="btn-tertiary">dismiss</button>
    <button class="btn-disabled">queued</button>
  </div>
  <div class="labels">
    <span class="lbl">primary · brass rule</span>
    <span class="lbl">secondary · underline</span>
    <span class="lbl">tertiary · bare</span>
    <span class="lbl">disabled</span>
  </div>
</div></body></html>
