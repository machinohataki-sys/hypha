<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .specimen { padding: 16px 20px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .h2 { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 26px; color: var(--fg-1); margin:0; }
  .h3 { font-family: var(--font-serif); font-weight: 500; font-size: 20px; color: var(--fg-1); margin:0; }
  .h4 { font-family: var(--font-sans); font-weight: 500; font-size: 17px; color: var(--fg-1); margin:0; letter-spacing: -0.012em; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="specimen">
    <div class="meta">h2 · cormorant 400 italic · 26</div>
    <h2 class="h2">the categorical imperative is consequentialist?</h2>
    <div class="meta">h3 · cormorant 500 · 20</div>
    <h3 class="h3">case file — warm-blooded dinosaurs</h3>
    <div class="meta">h4 · inter 500 · 17</div>
    <h4 class="h4">three follow-ups queued</h4>
  </div>
</div></body></html>
