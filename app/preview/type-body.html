<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .specimen { padding: 18px 22px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .body { font-family: var(--font-sans); font-weight: 400; font-size: 15px; line-height: 1.55; color: var(--fg-2); margin: 0 0 10px; max-width: 60ch; }
  .meta { font-family: var(--font-sans); font-weight: 450; font-size: 13px; color: var(--fg-3); }
  .micro { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); margin-top: 8px; }
</style></head>
<body><div class="card">
  <div class="specimen">
    <p class="body">three notes from october haven't been touched. the claim about ostrom's eighth principle was last verified forty-one days ago — does it still hold?</p>
    <div class="meta">last reviewed march 11, 2026 · 7 sources on file</div>
    <div class="micro">verify · quiz · case file · follow-up</div>
  </div>
</div></body></html>
