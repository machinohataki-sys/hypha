<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile {
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
    padding: 14px 16px; height: 110px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-sizing: border-box;
  }
  .r-lg   { border-radius: 18px; }
  .r-md   { border-radius: 14px; }
  .r-sm   { border-radius: 9px; }
  .name { font-family: var(--font-serif); font-style: italic; font-weight: 600; font-size: 18px; color: var(--fg-1); line-height: 1; letter-spacing: -0.005em; }
  .v    { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); letter-spacing: 0.05em; }
  .pill-row { margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    height: 22px; padding: 0 14px; border-radius: 999px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--verdict-clean);
    box-shadow: inset 0 0 0 1px rgba(95,166,122,0.55);
    background: rgba(95,166,122,0.10);
  }
  .pill-meta { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); letter-spacing: 0.05em; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="tile r-lg"><span class="name">large</span><span class="v">18px · panels</span></div>
    <div class="tile r-md"><span class="name">medium</span><span class="v">14px · buttons</span></div>
    <div class="tile r-sm"><span class="name">small</span><span class="v">9px · chips</span></div>
  </div>
  <div class="pill-row">
    <span class="pill">held</span>
    <span class="pill-meta">pill · 999px · for verdict stamps only</span>
  </div>
</div></body></html>
