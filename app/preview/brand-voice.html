<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .panel { border-radius: 18px; padding: 16px 20px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .row { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; align-items: baseline; }
  .k { font-family: var(--font-mono); font-size: 11px; color: var(--brass-bright); letter-spacing: 0.05em; }
  .v { font-family: var(--font-sans); font-size: 14px; color: var(--fg-2); }
  .v em { color: var(--brass-bright); font-style: italic; }
  .head { font-family: var(--font-serif); font-style: italic; font-size: 18px; color: var(--fg-1); margin-bottom: 10px; }
</style></head>
<body><div class="card">
  <div class="panel">
    <div class="head">voice · in three lines</div>
    <div class="row">
      <span class="k">do</span><span class="v">three notes from october haven't been touched. quiz them?</span>
      <span class="k">don't</span><span class="v" style="color: var(--fg-4);">🎉 You've reviewed 5 notes today!</span>
      <span class="k">do</span><span class="v">held. the claim is consistent with what's on file.</span>
    </div>
  </div>
</div></body></html>
