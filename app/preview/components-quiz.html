<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .panel {
    border-radius: 18px; padding: 18px 22px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18), 0 18px 48px -22px rgba(0,0,0,0.7);
  }
  .micro { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-bright); margin-bottom: 6px; }
  .q { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 22px; line-height: 1.25; color: var(--fg-1); margin-bottom: 16px; max-width: 56ch; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt {
    padding: 10px 14px; border-radius: 14px;
    font-family: var(--font-sans); font-size: 14px; color: var(--fg-1);
    background: rgba(26,20,16,0.45);
    box-shadow: inset 0 0 0 1px rgba(168,133,109,0.22);
  }
  .opt.sel { box-shadow: 0 0 0 1px rgba(213,178,138,0.55), 0 0 24px -4px rgba(232,161,60,0.35); }
  .key { font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--brass-bright); letter-spacing: 0.10em; margin-right: 12px; }
  .opt.sel .key { color: var(--brass-amber); }
</style></head>
<body><div class="card">
  <div class="panel">
    <div class="micro">quiz · march 14, 2026</div>
    <div class="q">what does ostrom's eighth design principle add to the original seven?</div>
    <div class="opts">
      <div class="opt"><span class="key">A</span>nested enterprises</div>
      <div class="opt sel"><span class="key">B</span>monitored sanctions</div>
      <div class="opt"><span class="key">C</span>collective-choice arenas</div>
      <div class="opt"><span class="key">D</span>graduated boundaries</div>
    </div>
  </div>
</div></body></html>
