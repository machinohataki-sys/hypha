<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .field {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px;
    background: #1a1410;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(168,133,109,0.18);
    font-family: var(--font-mono); font-size: 14px; color: var(--fg-1);
  }
  .prompt { color: var(--brass-bright); }
  .placeholder { color: var(--fg-4); }
  .caret { display: inline-block; width: 7px; height: 16px; background: var(--brass-amber); animation: blink 1s steps(2) infinite; vertical-align: middle; }
  @keyframes blink { 50% { opacity: 0; } }
  .field.focus { box-shadow: inset 0 1px 2px rgba(0,0,0,0.45), 0 0 0 1px rgba(213,178,138,0.55), 0 0 24px -4px rgba(232,161,60,0.35); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.10em; text-transform: uppercase; margin: 6px 0 4px; }
</style></head>
<body><div class="card">
  <div class="lbl">resting</div>
  <div class="field"><span class="prompt">›</span><span class="placeholder">verify, quiz, or paste a claim…</span></div>
  <div class="lbl" style="margin-top:14px;">focused</div>
  <div class="field focus"><span class="prompt">›</span>kant on the categorical imperative<span class="caret"></span></div>
</div></body></html>
