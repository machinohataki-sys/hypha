<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; align-items: center; gap: 28px; padding: 12px 0; }
  .mark { display: flex; align-items: center; gap: 14px; }
  img { display: block; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }
  .wordmark-lg { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: 64px; color: var(--fg-1); letter-spacing: 0.02em; line-height: 1; }
  .wordmark-lg::after { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8a13c, #a8856d); margin-left: 4px; vertical-align: 0.06em; }
</style></head>
<body><div class="card">
  <div class="row">
    <span class="wordmark-lg">ptor</span>
    <img src="../assets/ptor-icon.svg" width="48" height="48" alt="">
  </div>
  <div class="lbl">wordmark · cormorant garamond italic 400 · amber dot</div>
</div></body></html>
