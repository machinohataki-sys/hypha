<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .specimen { padding: 18px 22px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .display { font-family: var(--font-serif); font-weight: 400; font-size: 50px; line-height: 1.05; color: var(--fg-1); letter-spacing: -0.012em; margin: 0 0 6px; }
  .math { font-family: var(--font-math); font-style: italic; color: var(--brass-bright); font-size: 54px; }
  .meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="specimen">
    <div class="display">held in <span class="math">n</span> sources.</div>
    <div class="meta">cormorant 400 · math italic for variables · brand-supplied face</div>
  </div>
</div></body></html>
