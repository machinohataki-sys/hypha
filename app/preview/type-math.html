<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .specimen { padding: 18px 22px;
    background: rgba(44,36,31,0.58);
    backdrop-filter: blur(18px) saturate(130%);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(232,196,176,0.10), inset 0 0 0 1px rgba(168,133,109,0.18);
  }
  .row { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .glyph { font-family: var(--font-math); font-style: italic; color: var(--brass-bright); font-size: 56px; line-height: 1; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
  .glyph + .glyph { color: var(--fg-1); }
  .body { font-family: var(--font-sans); font-size: 13px; color: var(--fg-2); margin-top: 8px; max-width: 60ch; }
  em { font-family: var(--font-math); font-style: italic; color: var(--brass-bright); font-size: 16px; }
</style></head>
<body><div class="card">
  <div class="specimen">
    <div class="row">
      <span class="glyph">a</span><span class="glyph">f</span><span class="glyph">k</span><span class="glyph">x</span><span class="glyph">π</span><span class="glyph">θ</span>
    </div>
    <div class="lbl">--font-math · brand math-italic · for variables in prose</div>
    <div class="body">used inline: the rate of forgetting <em>r(t)</em> follows <em>e</em><sup>−<em>t/τ</em></sup>.</div>
  </div>
</div></body></html>
