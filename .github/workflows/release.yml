# Hypha — signed release pipeline (v1.0+).
#
# Fires on push of a `v*.*.*` tag. Runs the smoke aggregator first as a
# hard gate; if smokes fail, publishing is aborted. On green, each OS runs
# `electron-builder --publish always` which uploads installers + autoupdate
# metadata to the GitHub Release matching the tag.
#
# Secrets:
#   GITHUB_TOKEN          auto-provided by GitHub Actions (contents:write perm
#                         declared below — enough to create releases on the
#                         same repo, no user setup needed)
#   CSC_LINK / CSC_KEY_PASSWORD          (Windows code signing — optional)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (macOS notarize)
#
# Without Apple/Windows certs, builds ship unsigned ("unknown publisher"
# warning on first launch). Release upload itself works via GITHUB_TOKEN.

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-gate:
    name: smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:all

  publish:
    name: publish · ${{ matrix.os }}
    needs: smoke-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: windows-latest, target: win }
          - { os: macos-latest,   target: mac }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Publish via electron-builder
        # Bash shell on all 3 OSes (Git Bash on Windows runner). Lets us
        # conditionally export signing vars only when their secrets are set
        # — empty CSC_LINK / APPLE_ID values otherwise crash electron-builder
        # on macOS (treats "" as a file path).
        shell: bash
        env:
          # GitHub auto-provides GITHUB_TOKEN; electron-builder reads GH_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All signing secrets piped in; empty string when not configured.
          _CSC_LINK: ${{ secrets.CSC_LINK }}
          _CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          _APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export signing env when the secret is non-empty.
          if [ -n "$_CSC_LINK" ]; then
            export CSC_LINK="$_CSC_LINK"
            export CSC_KEY_PASSWORD="$_CSC_KEY_PASSWORD"
          fi
          if [ -n "$_APPLE_ID" ]; then
            export APPLE_ID="$_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$_APPLE_TEAM_ID"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run build:${{ matrix.target }} -- --publish always
