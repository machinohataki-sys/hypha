# Hypha — signed release pipeline (v1.0+).
#
# Fires on push of a `v*.*.*` tag. Runs the smoke aggregator first as a
# hard gate; if smokes fail, publishing is aborted. On green, each OS runs
# `electron-builder --publish always` which uploads installers + autoupdate
# metadata to the GitHub Release matching the tag.
#
# Secrets required for full pipeline:
#   GH_TOKEN              repo-scoped token for the release upload
#   CSC_LINK / CSC_KEY_PASSWORD          (Windows code signing — optional)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  (macOS notarize)
#
# Every secret-dependent step is guarded with `if: secrets.X != ''` so the
# workflow degrades gracefully for fork PRs (which cannot see secrets).

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-gate:
    name: smoke gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:all

  publish:
    name: publish · ${{ matrix.os }}
    needs: smoke-gate
    if: ${{ env.HAS_GH_TOKEN == 'true' || secrets.GH_TOKEN != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: linux }
          - { os: windows-latest, target: win }
          - { os: macos-latest,   target: mac }
    env:
      HAS_GH_TOKEN: ${{ secrets.GH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Publish via electron-builder
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Windows signing (skip cleanly if absent)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarization (skip cleanly if absent)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_ID != '' }}
        run: npm run build:${{ matrix.target }} -- --publish always
